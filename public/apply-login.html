<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in to apply</title>
<link rel="stylesheet" href="/style.css">
<style>
  .lead { color:var(--muted); margin:0 0 14px; }
  button.go { width:auto; height:42px; padding:0 22px; }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="eyebrow">Foundation Course &nbsp;&middot;&nbsp; FEC-28</div>
    <h1>Companies to apply to</h1>
    <p>Log in to see today's companies.</p>
  </div>
</header>
<main class="wrap">
  <section class="card">
    <h2>Log in</h2>
    <p class="lead">Use your roll number and the same email you used in the company form.</p>
    <div class="grid">
      <div class="field"><label for="roll">RTU roll number</label><input type="text" id="roll" maxlength="24" autocomplete="off"></div>
      <div class="field"><label for="email">Email ID</label><input type="text" id="email" maxlength="120" autocomplete="off" inputmode="email" autocapitalize="off"></div>
    </div>
    <div class="msg bad" id="msg"></div>
    <div class="hp" aria-hidden="true"><label>Leave empty <input type="text" id="hp" tabindex="-1" autocomplete="off"></label></div>
    <button class="go" id="login" type="button">Log in</button>
    <div style="height:14px"></div>
  </section>
</main>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* not available */ } }
  function check(roll, email) {
    return fetch('/api/apply?action=status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ roll: roll, email: email, hp: $('#hp').value }) })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
      .then(function (res) {
        if (res.status !== 200) { $('#msg').textContent = res.data.error || 'Could not log in.'; return; }
        save('applyRoll', roll); save('applyEmail', email);
        window.location.replace('/apply');
      }).catch(function () { $('#msg').textContent = 'Could not reach the server. Check your internet and try again.'; });
  }
  $('#login').onclick = function () { $('#msg').textContent = ''; check($('#roll').value, $('#email').value); };
  ['roll', 'email'].forEach(function (id) { $('#' + id).addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#login').click(); }); });
})();
</script>
</body>
</html>
