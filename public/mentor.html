<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mentor panel</title>
<link rel="stylesheet" href="/style.css">
<style>
  .wrap.wide { max-width:1280px; }
  .hero { padding:24px 0 20px; }
  .hero h1 { font-size:1.55rem; margin:0 0 4px; }
  main.wrap { padding-top:22px; padding-bottom:60px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .row input[type=text], .row input[type=password], .row select { width:auto; min-width:200px; }
  button { height:42px; padding:0 18px; font:600 .9rem "Segoe UI",system-ui,sans-serif; color:#fffaf0; background:var(--navy); border:1px solid var(--navy); border-radius:7px; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--navy2); }
  button:disabled { background:#b9bfc9; border-color:#b9bfc9; cursor:not-allowed; }
  button.plain { background:var(--paper); color:var(--navy); border-color:var(--line2); }
  button.plain:hover:not(:disabled) { background:var(--tint); }
  button.yes { background:#2f6b3f; border-color:#2f6b3f; } button.yes:hover:not(:disabled) { background:#27583a; }
  button.no { background:var(--paper); color:var(--bad); border-color:#e6c3bc; } button.no:hover:not(:disabled) { background:var(--badbg); }
  .err { color:var(--bad); font-size:.9rem; }
  .who { color:var(--muted); font-size:.88rem; margin-left:auto; }

  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  button.tab { background:var(--paper); color:var(--navy); border:1px solid var(--line2); height:auto; padding:8px 14px; text-align:left; line-height:1.25; }
  button.tab small { display:block; font-weight:400; color:var(--muted); font-size:.74rem; }
  button.tab.on { background:var(--navy); color:#fffaf0; border-color:var(--navy); } button.tab.on small { color:#d9c48a; }

  .grid2 { display:grid; grid-template-columns:300px 1fr; gap:18px; align-items:start; }
  .list { background:var(--paper); border:1px solid var(--line); border-radius:10px; max-height:72vh; overflow:auto; }
  .li { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); cursor:pointer; font-size:.92rem; }
  .li:hover { background:var(--tint); } .li.on { background:#e6eefb; font-weight:600; }
  .dots { display:flex; gap:4px; flex:none; }
  .dot { width:11px; height:11px; border-radius:50%; background:#cfd3da; }
  .dot.approved { background:#2f6b3f; } .dot.not_approved { background:#b5473a; }
  .empty { padding:18px; color:var(--muted); font-size:.9rem; }

  .pane { min-width:0; }
  .pane h2 { margin:0 0 4px; font-size:1.2rem; color:var(--navy); }
  .pane .sub { color:var(--muted); font-size:.86rem; margin-bottom:14px; }
  .co { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px; }
  .co h3 { margin:0 0 8px; font:700 1.05rem Georgia,serif; color:var(--navy); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .co .num { width:26px; height:26px; font-size:.8rem; }
  .st { display:inline-block; padding:2px 10px; border-radius:99px; font:600 .72rem "Segoe UI",system-ui,sans-serif; background:#eee8d6; color:#5b6475; }
  .st.approved { background:#e8f4e8; color:#2f6b3f; } .st.not_approved { background:var(--badbg); color:var(--bad); }
  .kv { display:grid; grid-template-columns:170px 1fr; gap:4px 12px; font-size:.9rem; margin:0 0 10px; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; word-break:break-word; }
  .kv a { color:var(--navy2); }
  .missing { color:var(--bad); font-weight:600; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btns button { height:38px; }
  .reason { margin-top:10px; } .reason textarea { width:100%; min-height:64px; padding:8px 10px; border:1px solid var(--line2); border-radius:7px; font:inherit; font-size:.92rem; }
  .note { font-size:.86rem; margin:8px 0 0; color:var(--muted); }
  .note.bad { color:var(--bad); }
  .bar2 { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  @media (max-width:820px) { .grid2 { grid-template-columns:1fr; } .list { max-height:40vh; } .kv { grid-template-columns:1fr; } .who { margin-left:0; } }
</style>
</head>
<body>
<header class="hero"><div class="wrap wide"><div class="eyebrow">Mentors</div><h1>Mentor panel</h1><p>Check each company of each student and approve it or not.</p></div></header>
<main class="wrap wide">
  <div class="row" id="login">
    <input type="password" id="pw" placeholder="Mentor password" autocomplete="off">
    <input type="text" id="mname" placeholder="Your name" maxlength="40" autocomplete="off">
    <button id="go" type="button">Open</button>
    <span class="err" id="loginErr"></span>
  </div>

  <div id="panel" hidden>
    <div class="row">
      <div id="tabs" class="tabs" style="margin:0"></div>
      <span class="who" id="who"></span>
      <button id="reload" class="plain" type="button">Refresh</button>
    </div>
    <div class="row">
      <select id="filter">
        <option value="open">Not fully checked yet</option>
        <option value="rejected">Has a company not approved</option>
        <option value="all">All students</option>
      </select>
      <input type="text" id="find" placeholder="Find a roll number" autocomplete="off">
      <span class="who" id="count"></span>
    </div>
    <div class="grid2">
      <div class="list" id="list"></div>
      <div class="pane" id="pane"><div class="empty">Choose a roll number on the left.</div></div>
    </div>
  </div>
</main>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var password = '', mentor = '', data = null, branch = null, selected = null, detail = null;

  function api(action, opts) {
    opts = opts || {};
    return fetch('/api/mentor?action=' + action + (opts.query || ''), {
      method: opts.method || 'GET',
      headers: { 'x-mentor-password': password, 'Content-Type': 'application/json' },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    }).then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); });
  }
  function el(tag, props, parent) { var e = document.createElement(tag); Object.keys(props || {}).forEach(function (k) { e[k] = props[k]; }); if (parent) parent.appendChild(e); return e; }

  // ---- login ----
  function open() {
    password = $('#pw').value; mentor = $('#mname').value.trim();
    $('#loginErr').textContent = '';
    if (mentor.length < 2) { $('#loginErr').textContent = 'Enter your name (at least 2 letters).'; return; }
    try { localStorage.setItem('mentorName', mentor); } catch (e) { /* not available */ }
    loadList(true);
  }
  $('#go').onclick = open;
  ['pw', 'mname'].forEach(function (id) { $('#' + id).addEventListener('keydown', function (e) { if (e.key === 'Enter') open(); }); });
  try { var saved = localStorage.getItem('mentorName'); if (saved) $('#mname').value = saved; } catch (e) { /* not available */ }

  function loadList(first) {
    return api('list').then(function (r) {
      if (r.status === 401) { $('#loginErr').textContent = 'Wrong password.'; $('#panel').hidden = true; $('#login').hidden = false; return; }
      data = r.data;
      $('#login').hidden = true; $('#panel').hidden = false;
      $('#who').textContent = 'Checking as ' + mentor;
      if (first || !branch) branch = (data.branches.filter(function (b) { return data.students.some(function (s) { return s.branch === b.code; }); })[0] || data.branches[0]).code;
      drawTabs(); drawList();
    });
  }

  // ---- branches and the list of roll numbers ----
  function inBranch(code) { return data.students.filter(function (s) { return s.branch === code; }); }
  function drawTabs() {
    var box = $('#tabs'); box.textContent = '';
    data.branches.forEach(function (b) {
      var list = inBranch(b.code); if (b.code === 'OT' && !list.length) return;
      var done = list.filter(function (s) { return s.unchecked === 0 && s.not_approved === 0; }).length;
      var t = el('button', { className: 'tab' + (b.code === branch ? ' on' : ''), type: 'button' }, box);
      t.appendChild(document.createTextNode(b.label));
      el('small', { textContent: list.length + ' students, ' + done + ' fully approved' }, t);
      t.onclick = function () { branch = b.code; selected = null; drawTabs(); drawList(); $('#pane').textContent = ''; el('div', { className: 'empty', textContent: 'Choose a roll number on the left.' }, $('#pane')); };
    });
  }
  function drawList() {
    var f = $('#filter').value, q = $('#find').value.trim().toUpperCase();
    var rows = inBranch(branch).filter(function (s) {
      if (q && s.roll_no.toUpperCase().indexOf(q) === -1) return false;
      if (f === 'open') return s.unchecked > 0;
      if (f === 'rejected') return s.not_approved > 0;
      return true;
    });
    $('#count').textContent = rows.length + ' shown';
    var box = $('#list'); box.textContent = '';
    if (!rows.length) { el('div', { className: 'empty', textContent: f === 'open' ? 'Everyone in this branch has been checked.' : 'No students to show.' }, box); return; }
    rows.forEach(function (s) {
      var li = el('div', { className: 'li' + (s.roll_no === selected ? ' on' : '') }, box);
      el('span', { textContent: s.roll_no }, li);
      var dots = el('span', { className: 'dots' }, li);
      for (var i = 0; i < s.count; i++) el('i', { className: 'dot ' + (i < s.approved ? 'approved' : i < s.approved + s.not_approved ? 'not_approved' : '') }, dots);
      li.onclick = function () { choose(s.roll_no); };
    });
  }
  $('#filter').onchange = drawList;
  $('#find').addEventListener('input', drawList);
  $('#reload').onclick = function () { var b = this; b.disabled = true; loadList().then(function () { b.disabled = false; if (selected) choose(selected, true); }, function () { b.disabled = false; }); };
  setInterval(function () { if (password && !document.hidden && !$('#panel').hidden) loadList(); }, 60000);

  // ---- one student ----
  function choose(roll, keep) {
    selected = roll; drawList();
    if (!keep) { $('#pane').textContent = 'Loading...'; }
    api('student', { query: '&roll=' + encodeURIComponent(roll) }).then(function (r) {
      if (r.status !== 200) { $('#pane').textContent = r.data.error || 'Could not load this student.'; return; }
      detail = r.data; drawPane();
    });
  }
  function link(parent, value) {
    if (!value) { el('span', { textContent: 'not given', className: 'note' }, parent); return; }
    if (/^https?:\/\//i.test(value)) { var a = el('a', { href: value, target: '_blank', rel: 'noopener noreferrer', textContent: value }, parent); return a; }
    if (/^[^\s@]+@[^\s@]+$/.test(value)) { el('a', { href: 'mailto:' + value, textContent: value }, parent); return; }
    parent.appendChild(document.createTextNode(value));
  }
  function statusTag(parent, c) {
    if (c.mentor_decision === 'approved') el('span', { className: 'st approved', textContent: 'Approved by ' + c.mentor_name }, parent);
    else if (c.mentor_decision === 'not_approved') el('span', { className: 'st not_approved', textContent: 'Not approved by ' + c.mentor_name }, parent);
    else el('span', { className: 'st', textContent: 'Not checked yet' }, parent);
  }

  function drawPane() {
    var pane = $('#pane'); pane.textContent = '';
    el('h2', { textContent: detail.roll_no }, pane);
    el('div', { className: 'sub', textContent: detail.companies.length + ' companies' }, pane);
    var bar = el('div', { className: 'bar2' }, pane);
    var all = el('button', { className: 'yes', type: 'button', textContent: 'Approve the ones not checked yet' }, bar);
    var nxt = el('button', { className: 'plain', type: 'button', textContent: 'Next student' }, bar);
    var msg = el('span', { className: 'note' }, bar);
    all.onclick = function () {
      if (!confirm('Approve every company of ' + detail.roll_no + ' that is not checked yet and has its three details filled? Companies you already approved or rejected stay as they are.')) return;
      all.disabled = true;
      api('decide_all', { method: 'POST', body: { roll: detail.roll_no, mentor: mentor } }).then(function (r) {
        all.disabled = false;
        if (!r.data.ok) { msg.className = 'note bad'; msg.textContent = r.data.message || 'Could not approve.'; return; }
        msg.className = 'note'; msg.textContent = 'Approved ' + r.data.approved + (r.data.skipped.length ? '. Left ' + r.data.skipped.length + ' as they were (already decided, or details missing).' : '.');
        loadList().then(function () { choose(detail.roll_no, true); });
      });
    };
    nxt.onclick = function () { nextStudent(); };

    detail.companies.forEach(function (c) { company(pane, c); });
  }

  function company(pane, c) {
    var box = el('div', { className: 'co' }, pane);
    var h = el('h3', {}, box);
    el('span', { className: 'num', textContent: c.position }, h);
    h.appendChild(document.createTextNode(c.name));
    statusTag(h, c);

    var dl = el('dl', { className: 'kv' }, box);
    function row(label, fill) { el('dt', { textContent: label }, dl); fill(el('dd', {}, dl)); }
    row('Website', function (d) { link(d, /^https?:/i.test(c.website) ? c.website : 'https://' + c.website); });
    row('Domain', function (d) { d.textContent = c.domain || 'not given'; });
    row('Domain-specific link or email', function (d) { link(d, c.domain_link); });
    row('Fresher hiring link or email', function (d) { link(d, c.general_link); });
    row('Employee strength', function (d) { if (c.employee_strength) d.textContent = c.employee_strength; else el('span', { className: 'missing', textContent: 'not filled' }, d); });
    row('Fresher package', function (d) { if (c.package_lpa != null) d.textContent = c.package_lpa + ' LPA'; else el('span', { className: 'missing', textContent: 'not filled' }, d); });
    row('Yearly revenue', function (d) { if (c.revenue_amount != null && c.revenue_unit) d.textContent = c.revenue_amount + ' ' + c.revenue_unit + ' ' + c.revenue_currency; else el('span', { className: 'missing', textContent: 'not filled' }, d); });
    if (c.mentor_decision === 'not_approved' && c.mentor_note) row('Reason given', function (d) { d.textContent = c.mentor_note; });

    var btns = el('div', { className: 'btns' }, box);
    var yes = el('button', { className: 'yes', type: 'button', textContent: 'Approve' }, btns);
    var no = el('button', { className: 'no', type: 'button', textContent: 'Not approve' }, btns);
    var note = el('div', { className: 'note' }, box);
    if (!c.details_complete) { yes.disabled = true; note.className = 'note bad'; note.textContent = 'The three company details are not filled, so this company cannot be approved yet.'; }

    function done(r) {
      if (!r.data.ok) { note.className = 'note bad'; note.textContent = r.data.message || 'Could not save.'; yes.disabled = no.disabled = false; return; }
      loadList().then(function () { choose(detail.roll_no, true); });
    }
    yes.onclick = function () {
      yes.disabled = no.disabled = true;
      api('decide', { method: 'POST', body: { roll: detail.roll_no, position: c.position, decision: 'approved', mentor: mentor } }).then(done);
    };
    no.onclick = function () {
      if (box.querySelector('.reason')) return;
      var rs = el('div', { className: 'reason' }, box);
      var ta = el('textarea', { placeholder: 'Write the reason the student will read, e.g. "Careers page. Give the link of one specific job."', maxLength: 300 }, rs);
      var row2 = el('div', { className: 'btns', style: 'margin-top:8px' }, rs);
      var ok = el('button', { className: 'no', type: 'button', textContent: 'Confirm: not approved' }, row2);
      var cancel = el('button', { className: 'plain', type: 'button', textContent: 'Cancel' }, row2);
      ta.focus();
      cancel.onclick = function () { rs.remove(); };
      ok.onclick = function () {
        if (ta.value.trim().length < 3) { note.className = 'note bad'; note.textContent = 'Write a short reason first.'; return; }
        ok.disabled = true;
        api('decide', { method: 'POST', body: { roll: detail.roll_no, position: c.position, decision: 'not_approved', note: ta.value, mentor: mentor } }).then(function (r) { ok.disabled = false; done(r); });
      };
    };
  }

  function nextStudent() {
    var rows = inBranch(branch).filter(function (s) { return s.unchecked > 0 && s.roll_no !== selected; });
    var after = rows.filter(function (s) { return s.roll_no.localeCompare(selected, 'en', { numeric: true }) > 0; })[0] || rows[0];
    if (after) choose(after.roll_no); else { $('#pane').textContent = 'Nobody else is left to check in this branch.'; }
  }
})();
</script>
</body>
</html>
